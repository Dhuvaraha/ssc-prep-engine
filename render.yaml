services:
  - type: web
    name: ssc-prep-engine-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: REVIEWER_EMAILS
        sync: false
      - key: REGISTRATION_ENABLED
        value: "false"
      - key: PRIVATE_ASSET_DIR
        value: data/private/assets

  - type: web
    name: ssc-prep-engine-web
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: node server.mjs
    healthCheckPath: /__health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_BASE_URL
        value: https://ssc-prep-engine-api.onrender.com/api/v1
      - key: VITE_REGISTRATION_ENABLED
        value: "false"
