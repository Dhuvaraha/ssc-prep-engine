name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node --check server.mjs
      - name: Smoke production SPA server
        run: |
          PORT=4173 node server.mjs >/tmp/ssc-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill $WEB_PID' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/__health >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent --head http://127.0.0.1:4173/ >/dev/null
          curl --fail --silent --head http://127.0.0.1:4173/learn >/dev/null
          curl --fail --silent --head http://127.0.0.1:4173/mocks >/dev/null
          if curl --fail --silent --head http://127.0.0.1:4173/assets/does-not-exist.js >/dev/null; then
            echo "missing assets must not fall back to index.html"
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pyflakes app tests
      - run: python -m compileall app
      - run: PYTHONPATH=. pytest -q

  phase-a-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: phase_a_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: ssc_phase_a_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U phase_a_test -d ssc_phase_a_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - name: Create synthetic direct-client roles
        env:
          PGPASSWORD: synthetic-ci-only
        run: psql -h 127.0.0.1 -p 55432 -U phase_a_test -d ssc_phase_a_test -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;'
      - name: PostgreSQL security, concurrency and migration tests
        working-directory: backend
        env:
          PHASE_A_TEST_DATABASE_URL: postgresql+psycopg://phase_a_test:synthetic-ci-only@127.0.0.1:55432/ssc_phase_a_test
        run: python -m pytest tests/test_phase_a_security.py -q

  phase-a-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
