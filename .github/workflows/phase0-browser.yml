name: Phase 0 Browser QA
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/phase0-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-chromium:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run responsive browser acceptance
        run: |
          PORT=4173 node server.mjs >/tmp/phase0-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill $WEB_PID' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/__health >/dev/null; then break; fi
            sleep 1
          done
          node scripts/phase0-browser-smoke.mjs
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-chromium-screenshots
          path: frontend/artifacts/browser
          if-no-files-found: ignore
